<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="NexCart project placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b16"/>
      <stop offset="100%" stop-color="#12121f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="240" cy="140" r="200" fill="#22d3ee" opacity="0.16" filter="url(#blur)"/>
  <circle cx="980" cy="620" r="220" fill="#ec4899" opacity="0.14" filter="url(#blur)"/>
  <circle cx="620" cy="380" r="240" fill="#8b5cf6" opacity="0.12" filter="url(#blur)"/>

  <g opacity="0.28" stroke="#ffffff" stroke-width="1">
    <path d="M0 150 H1200 M0 300 H1200 M0 450 H1200 M0 600 H1200"/>
    <path d="M200 0 V750 M400 0 V750 M600 0 V750 M800 0 V750 M1000 0 V750"/>
  </g>

  <rect x="120" y="230" width="960" height="290" rx="24" fill="#0d0d18" stroke="#ffffff" stroke-opacity="0.10"/>
  <rect x="120" y="230" width="960" height="60" rx="24" fill="url(#accent)" opacity="0.9"/>
  <rect x="120" y="266" width="960" height="24" fill="#0d0d18"/>
  <circle cx="160" cy="260" r="9" fill="#06060d" opacity="0.6"/>
  <circle cx="192" cy="260" r="9" fill="#06060d" opacity="0.6"/>
  <circle cx="224" cy="260" r="9" fill="#06060d" opacity="0.6"/>

  <rect x="170" y="330" width="240" height="150" rx="14" fill="#12121f" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="440" y="330" width="240" height="150" rx="14" fill="#12121f" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="710" y="330" width="240" height="150" rx="14" fill="#12121f" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="190" y="350" width="120" height="12" rx="6" fill="url(#accent)"/>
  <rect x="460" y="350" width="120" height="12" rx="6" fill="url(#accent)"/>
  <rect x="730" y="350" width="120" height="12" rx="6" fill="url(#accent)"/>

  <text x="600" y="612" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="700" fill="url(#accent)">NexCart</text>
  <text x="600" y="654" text-anchor="middle" font-family="ui-monospace, monospace" font-size="22" fill="#9a9ab2">placeholder image — replace in /images</text>
