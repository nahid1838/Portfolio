<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="TaskFlow project placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b16"/>
      <stop offset="100%" stop-color="#12121f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="1000" cy="150" r="200" fill="#8b5cf6" opacity="0.16" filter="url(#blur)"/>
  <circle cx="200" cy="600" r="220" fill="#22d3ee" opacity="0.13" filter="url(#blur)"/>

  <g fill="#12121f" stroke="#ffffff" stroke-opacity="0.10">
    <rect x="120" y="200" width="300" height="420" rx="20"/>
    <rect x="450" y="200" width="300" height="420" rx="20"/>
    <rect x="780" y="200" width="300" height="420" rx="20"/>
  </g>

  <g fill="url(#accent)">
    <rect x="150" y="230" width="120" height="14" rx="7"/>
    <rect x="480" y="230" width="120" height="14" rx="7"/>
    <rect x="810" y="230" width="120" height="14" rx="7"/>
  </g>

  <g fill="#0d0d18" stroke="#ffffff" stroke-opacity="0.09">
    <rect x="150" y="270" width="240" height="80" rx="12"/>
    <rect x="150" y="366" width="240" height="80" rx="12"/>
    <rect x="480" y="270" width="240" height="80" rx="12"/>
    <rect x="810" y="270" width="240" height="80" rx="12"/>
    <rect x="810" y="366" width="240" height="80" rx="12"/>
  </g>

  <g fill="#26263a">
    <rect x="170" y="292" width="150" height="10" rx="5"/>
    <rect x="170" y="312" width="100" height="10" rx="5"/>
    <rect x="170" y="388" width="150" height="10" rx="5"/>
    <rect x="170" y="408" width="90" height="10" rx="5"/>
    <rect x="500" y="292" width="150" height="10" rx="5"/>
    <rect x="500" y="312" width="110" height="10" rx="5"/>
    <rect x="830" y="292" width="150" height="10" rx="5"/>
    <rect x="830" y="312" width="95" height="10" rx="5"/>
    <rect x="830" y="388" width="150" height="10" rx="5"/>
    <rect x="830" y="408" width="105" height="10" rx="5"/>
  </g>

  <text x="600" y="690" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="700" fill="url(#accent)">TaskFlow</text>
</svg>
